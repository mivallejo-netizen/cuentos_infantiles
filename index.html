<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tobías y su Mochila Invisible</title>
<style>
  :root{
    --morado:#7c5cff;
    --morado-osc:#5b3fd6;
    --amarillo:#ffc93c;
    --naranja:#ff8a5b;
    --verde:#4cc9a7;
    --rosa:#ff6b9d;
    --azul:#4ea8de;
    --crema:#fff8ec;
    --texto:#3a2e4d;
    --gris:#8a819e;
    --radio:22px;
    --sombra: 0 8px 24px rgba(90,60,150,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',sans-serif;
    background:linear-gradient(160deg,#fdf3e7 0%, #eef1ff 60%, #e9fbf4 100%);
    color:var(--texto);
    min-height:100vh;
    padding-bottom:60px;
  }
  #rewardbar{
    position:sticky; top:0; z-index:50;
    display:flex; gap:14px; align-items:center; justify-content:center;
    flex-wrap:wrap;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(6px);
    padding:10px 16px;
    box-shadow:0 4px 14px rgba(90,60,150,0.12);
    border-bottom:3px solid var(--amarillo);
  }
  .reward-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--crema);
    border-radius:30px;
    padding:6px 14px;
    font-weight:bold;
    font-size:15px;
    border:2px solid #ffe1a8;
    transition:transform .25s;
  }
  .reward-chip.pop{transform:scale(1.25);}
  #app{
    max-width:760px;
    margin:0 auto;
    padding:22px 18px 40px;
  }
  .card{
    background:#fff;
    border-radius:var(--radio);
    padding:26px 24px;
    box-shadow:var(--sombra);
    margin-bottom:22px;
    animation:fadeIn .5s ease;
    border:3px solid #f1e9ff;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
  h1{color:var(--morado-osc); font-size:26px; margin-top:0;}
  h2{color:var(--morado-osc); font-size:21px;}
  h3{color:var(--naranja); font-size:18px; margin-bottom:6px;}
  p{line-height:1.65; font-size:17px;}
  .illustration{
    background:linear-gradient(135deg,#fff6e0,#eafff5);
    border-radius:18px;
    padding:26px;
    text-align:center;
    font-size:56px;
    margin-bottom:16px;
    border:2px dashed #ffd27a;
    letter-spacing:10px;
  }
  .illustration-caption{
    font-size:13px; color:var(--gris); margin-top:6px; letter-spacing:0; font-style:italic;
  }
  .vocab{
    color:var(--rosa); font-weight:bold; cursor:pointer;
    border-bottom:2px dotted var(--rosa);
    padding:0 1px;
  }
  .vocab:hover{background:#ffe9f2;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:16px;
    padding:12px 20px;
    font-size:16px;
    font-weight:bold;
    transition:transform .15s, box-shadow .15s;
  }
  button:active{transform:scale(0.96);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{
    background:var(--morado); color:#fff;
    box-shadow:0 6px 0 var(--morado-osc);
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.06);}
  .btn-secondary{
    background:#fff; color:var(--morado-osc);
    border:2px solid var(--morado);
  }
  .btn-option{
    display:block; width:100%; text-align:left;
    background:var(--crema); color:var(--texto);
    border:2px solid #ffe1a8;
    margin:8px 0; padding:14px 16px;
    border-radius:14px; font-size:16px;
  }
  .btn-option:hover:not(:disabled){background:#fff1cf;}
  .btn-option.correct{background:#d9f7ec; border-color:var(--verde); color:#1c6b52;}
  .btn-option.wrong{background:#ffe3e3; border-color:#ff8a8a; color:#8a2b2b;}
  .hint-box{
    background:#f4f0ff; border-left:5px solid var(--morado);
    border-radius:10px; padding:10px 14px; margin:10px 0;
    font-size:15px;
  }
  .feedback{
    border-radius:14px; padding:14px 16px; margin-top:12px; font-size:16px;
    background:#fff7e6; border:2px solid var(--amarillo);
  }
  .feedback.good{background:#e6fbf2; border-color:var(--verde);}
  textarea{
    width:100%; min-height:90px; border-radius:14px; border:2px solid #e2d9ff;
    padding:12px; font-family:inherit; font-size:15px; resize:vertical;
  }
  .nav-row{display:flex; gap:12px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}
  .badge-emoji{font-size:44px;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(50,30,80,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:#fff; border-radius:20px; padding:24px; max-width:380px; width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,0.3);
  }
  .modal h3{margin-top:0; color:var(--rosa);}
  .order-item{
    display:flex; align-items:center; gap:10px; background:var(--crema);
    border:2px solid #ffe1a8; border-radius:14px; padding:10px 14px; margin:8px 0;
  }
  .order-item .txt{flex:1; font-size:15px;}
  .order-item button{padding:6px 10px; font-size:14px; border-radius:10px;}
  .tag{
    display:inline-block; background:#fff1cf; color:#8a5c00; border-radius:20px;
    padding:3px 12px; font-size:13px; font-weight:bold; margin-bottom:10px;
  }
  .progressdots{display:flex; gap:8px; justify-content:center; margin-bottom:18px;}
  .dot{width:12px; height:12px; border-radius:50%; background:#e4dcff;}
  .dot.on{background:var(--morado);}
  ul.creative-list{padding-left:20px;}
  ul.creative-list li{margin-bottom:8px; line-height:1.5;}
  .center{text-align:center;}
  .small{font-size:13px; color:var(--gris);}
</style>
</head>
<body>

<div id="rewardbar"></div>
<div id="app"></div>

<div id="modalRoot"></div>

<script>
/* ================= DATOS DEL CUENTO ================= */

const STORY_TITLE = "Tobías y su Mochila Invisible";
const AGE_RANGE = "6 a 8 años";

const VOCAB = {
  pesada: {
    palabra:"pesada", emoji:"🏋️",
    significado:"Que cuesta mucho esfuerzo cargar o mover.",
    ejemplo:"La mochila de Tobías era invisible, pero se sentía muy pesada.",
    sinonimos:["difícil de cargar","cargada"]
  },
  invisible: {
    palabra:"invisible", emoji:"👻",
    significado:"Que no se puede ver, aunque exista de verdad.",
    ejemplo:"Su mochila era invisible: nadie más podía verla, solo sentirla.",
    sinonimos:["que no se ve"]
  },
  acompañar: {
    palabra:"acompañar", emoji:"🤝",
    significado:"Estar junto a alguien y ayudarlo, para que no se sienta solo.",
    ejemplo:"Valeria quiso acompañar a Tobías mientras pensaban una solución.",
    sinonimos:["estar con","apoyar"]
  },
  sonrojada: {
    palabra:"sonrojada", emoji:"😳",
    significado:"Cuando la cara se pone roja, normalmente por vergüenza o timidez.",
    ejemplo:"La niña quedó un poco sonrojada al contar su secreto.",
    sinonimos:["ruborizada","avergonzada"]
  },
  secreto: {
    palabra:"secreto", emoji:"🤫",
    significado:"Algo que guardamos y no contamos a todos.",
    ejemplo:"Tobías por fin contó su secreto a toda la clase.",
    sinonimos:["confidencia"]
  },
  orgulloso: {
    palabra:"orgulloso", emoji:"😊",
    significado:"Sentir alegría y satisfacción por algo que hicimos o dijimos.",
    ejemplo:"Tobías se sintió orgulloso de haber compartido su secreto.",
    sinonimos:["satisfecho","contento de sí mismo"]
  }
};

const SCENES = [
{
  id:1,
  resumen:"Tobías siempre llega el último a los juegos porque carga una mochila invisible muy pesada.",
  illEmoji:"🎒👦🏫",
  illDesc:"Un patio de colegio soleado con niños jugando y corriendo. Tobías, un niño de cabello castaño, camina despacio y con esfuerzo, como si cargara algo muy pesado sobre la espalda, aunque no se ve ninguna mochila real. A lo lejos, otros niños lo llaman desde la otra punta del patio. Colores cálidos, ambiente escolar cotidiano.",
  html:`En el patio del colegio, Tobías siempre llegaba el último a todos los juegos. No era porque no quisiera correr rápido: sobre su espalda cargaba una mochila <span class="vocab" data-word="invisible">invisible</span>, tan <span class="vocab" data-word="pesada">pesada</span> que solo él podía sentirla. Nadie más la veía, pero para Tobías pesaba como si llevara piedras adentro.
  <br><br>
  Algunos días, la mochila pesaba un poco menos, y Tobías podía correr casi tan rápido como sus compañeros. Pero otros días, como ese lunes, cada paso le costaba el doble de esfuerzo. —¡Vamos, Tobías, apúrate! —le gritaban sus compañeros desde la otra punta del patio, sin saber lo que él cargaba en silencio.`,
  q:{
    prompt:"¿Por qué Tobías siempre llegaba el último a los juegos?",
    options:["Porque cargaba una mochila invisible muy pesada","Porque no le gustaba jugar","Porque se quedaba dormido en clase"],
    correct:0,
    hints:[
      "Vuelve a leer el primer párrafo de la escena.",
      "No se trataba de una mochila real que se pudiera ver.",
      "Tobías la sentía como si llevara piedras adentro."
    ],
    explicacion:"¡Exacto! Tobías cargaba una mochila invisible muy pesada, que hacía que cada paso le costara más esfuerzo."
  }
},
{
  id:2,
  resumen:"Valeria, una niña nueva, se acerca a Tobías con curiosidad y amabilidad.",
  illEmoji:"👧🤔👦",
  illDesc:"Una niña nueva de coletas, llamada Valeria, sentada junto a Tobías en un rincón tranquilo del patio, mirándolo con curiosidad amable, sin burla. Tobías la mira, dudando si contarle su secreto. Ambiente cálido y de confianza, colores suaves.",
  html:`Esa tarde, una niña nueva llamada Valeria se sentó junto a Tobías en el rincón del patio, mientras él descansaba un momento. —¿Por qué te sientas aquí solo? —le preguntó, con curiosidad pero sin burlarse. Tobías dudó, pero algo en la forma amable de preguntar lo hizo animarse a contarle la verdad: —Cargo una mochila invisible. A veces pesa tanto que necesito parar a descansar.
  <br><br>
  Valeria no se rió ni le dijo que estaba inventando cosas. Solo asintió despacio y dijo: —Debe ser difícil cargar algo que nadie más puede ver. ¿Puedo <span class="vocab" data-word="acompañar">acompañarte</span> a pensar cómo hacerlo más fácil?`,
  q:{
    prompt:"¿Quién se sentó junto a Tobías y le preguntó con curiosidad, sin burlarse?",
    options:["Valeria","Don Tomás","Un maestro"],
    correct:0,
    hints:[
      "Es una niña nueva en el colegio.",
      "Se sentó con él en el rincón del patio.",
      "Su nombre empieza con la letra V."
    ],
    explicacion:"¡Correcto! Valeria se acercó a Tobías con curiosidad amable y le preguntó qué le pasaba."
  }
},
{
  id:3,
  resumen:"Juntos buscan pequeños trucos para hacer la mochila de Tobías más fácil de cargar.",
  illEmoji:"🎒✨💡",
  illDesc:"Tobías y Valeria sentados juntos, conversando e imaginando ideas: pequeñas nubes de pensamiento con dibujos de pausas, manos pidiendo ayuda y correas decoradas de colores. Ambiente de complicidad y esperanza, colores morados y amarillos suaves.",
  html:`Juntos, Tobías y Valeria empezaron a buscar ideas. Ella le sugirió decorar las correas de su mochila invisible con los colores que más le gustaban, para recordar que era suya y que podía hacerla un poco más liviana con pequeños trucos: descansar unos minutos cuando la sintiera muy pesada, pedir ayuda sin pena, y avisar a la maestra cuando necesitara más tiempo.
  <br><br>
  Al principio, Tobías tenía miedo de que sus compañeros pensaran que estaba inventando excusas. Pero Valeria le recordó: —Cada persona carga cosas distintas. Lo importante es encontrar tu propia forma de llevarlas. Poco a poco, Tobías empezó a pedir esas pequeñas pausas, y notó que, aunque la mochila seguía ahí, ya no se sentía tan solo cargándola.`,
  q:{
    prompt:"¿Qué le sugirió Valeria a Tobías para sentirse mejor?",
    options:["Buscar pequeños trucos, como descansar y pedir ayuda","Dejar de ir al colegio","Cargar una mochila real para practicar"],
    correct:0,
    hints:[
      "Piensa en las ideas que mencionaron juntos: correas decoradas, pausas, pedir ayuda.",
      "No se trataba de eliminar la mochila, sino de cargarla mejor.",
      "Una de las ideas era avisar a la maestra cuando necesitara más tiempo."
    ],
    explicacion:"¡Así es! Valeria y Tobías buscaron pequeños trucos: descansar, pedir ayuda sin pena y avisar cuando necesitara más tiempo."
  }
},
{
  id:4,
  resumen:"Tobías cuenta su secreto al grupo y descubre que otros compañeros también cargan su propia mochila invisible.",
  illEmoji:"🎒🤗👧👦",
  illDesc:"Un grupo de niños en círculo en el patio, con Tobías en el centro contando su historia. Algunos compañeros levantan la mano, sonriendo con comprensión. Ambiente cálido de comunidad y aceptación, colores brillantes y variados.",
  html:`Unos días después, durante la hora del recreo, Tobías se animó a contarle a todo el grupo sobre su mochila invisible. Para su sorpresa, varios compañeros levantaron la mano. —Yo también cargo una —dijo Martín—: la mía pesa más cuando extraño a mi abuela. —Y la mía pesa cuando tengo que hablar en público —agregó otra niña, un poco <span class="vocab" data-word="sonrojada">sonrojada</span>.
  <br><br>
  Ese día, el grupo entendió que todos, de alguna forma, cargaban su propia mochila invisible, distinta y personal. Algunos pesaban más unos días que otros, y estaba bien pedir ayuda o tomarse un descanso. Desde entonces, cuando alguien se quedaba atrás en un juego, en lugar de apurarlo, sus compañeros le preguntaban: —¿Tu mochila pesa hoy? ¿Te ayudamos con algo? Tobías sonrió, <span class="vocab" data-word="orgulloso">orgulloso</span> de haber compartido su <span class="vocab" data-word="secreto">secreto</span>.`,
  q:{
    prompt:"Verdadero o falso: ningún otro compañero tenía una mochila invisible propia.",
    options:["Verdadero","Falso"],
    correct:1,
    hints:[
      "Vuelve a leer lo que dijeron Martín y la otra niña.",
      "Ellos también mencionaron algo que pesaba en ciertos momentos.",
      "El cuento dice que 'todos, de alguna forma, cargaban su propia mochila invisible'."
    ],
    explicacion:"¡Correcto, es falso! Martín y otra compañera también contaron que tenían su propia mochila invisible."
  }
}
];

const LEVEL2 = [
  {
    prompt:"¿Por qué crees que Tobías tenía miedo de contarle a sus compañeros sobre su mochila?",
    hints:["Piensa en cómo a veces tememos que los demás no entiendan algo que nos pasa.","¿Qué podría pensar Tobías que dirían sus compañeros?"],
    guia:"Muchos lectores piensan que Tobías temía que sus compañeros no le creyeran o pensaran que estaba inventando una excusa para no esforzarse. Por eso guardaba su secreto."
  },
  {
    prompt:"¿Cómo crees que se sintió Tobías cuando Valeria le preguntó con amabilidad, en vez de burlarse?",
    hints:["Piensa en cómo nos sentimos cuando alguien nos escucha sin juzgarnos.","Fíjate en que Tobías se animó a contarle la verdad después de esa pregunta."],
    guia:"Es probable que Tobías se sintiera aliviado y en confianza, porque encontró a alguien dispuesta a escucharlo sin burlarse ni juzgarlo."
  },
  {
    prompt:"¿Por qué crees que a Martín su mochila le pesaba más cuando extrañaba a su abuela?",
    hints:["Piensa en que la 'mochila invisible' representa cosas distintas para cada persona.","¿Extrañar a alguien puede sentirse pesado por dentro?"],
    guia:"La mochila invisible de cada personaje representa algo distinto: para Martín, extrañar a su abuela lo hacía sentir más cansado o triste, y por eso decía que 'pesaba más' esos días."
  },
  {
    prompt:"¿Qué cambió en el grupo después de que Tobías compartió su secreto?",
    hints:["Fíjate en cómo trataban a los compañeros que se quedaban atrás antes y después.","Piensa en la pregunta nueva que empezaron a hacerse entre ellos."],
    guia:"El grupo empezó a tratarse con más comprensión: en vez de apurar a quien se quedaba atrás, le preguntaban si su 'mochila' pesaba ese día y cómo podían ayudar."
  }
];

const LEVEL3 = [
  {
    prompt:"¿Estás de acuerdo con la forma en que Valeria ayudó a Tobías? ¿Qué habrías hecho tú en su lugar?",
    guia:"Muchos niños piensan que escuchar sin juzgar y ofrecer ayuda, como hizo Valeria, es una gran forma de acompañar a un amigo. Otros imaginan otras ideas, como buscar ayuda de un adulto. ¡Todas pueden ser válidas!"
  },
  {
    prompt:"¿Por qué crees que es bueno contarle a alguien de confianza lo que nos pasa, en vez de guardarlo siempre en secreto?",
    guia:"Una idea común es que compartir lo que sentimos nos ayuda a sentirnos menos solos, y que la otra persona puede ayudarnos a encontrar soluciones, como le pasó a Tobías."
  },
  {
    prompt:"¿Qué enseñanza te deja este cuento sobre las diferencias entre las personas?",
    guia:"Muchos lectores creen que la enseñanza es que todas las personas cargamos cosas distintas y a veces invisibles, y que tratarnos con paciencia y comprensión ayuda a todos a sentirse mejor."
  }
];

const CREATIVE_OPTIONS = [
  "Dibuja tu propia 'mochila invisible' y decórala con los colores que más te gustan.",
  "Escribe una carta corta a Tobías contándole algo que a ti también te cueste un poquito más que a otros.",
  "Inventa qué otro truco podría ayudar a Tobías a cargar mejor su mochila.",
  "Cuenta (o dibuja) cómo ayudarías a un amigo que está cargando algo pesado, visible o invisible."
];

/* ================= ESTADO DEL JUEGO ================= */

const state = {
  screen:"intro",
  sceneIndex:0,
  rewards:{stars:0, pages:0, lupas:0, pieces:0, badge:false},
  vocabExplored:new Set(),
  lvl1:{},
  orderArrangement:null,
  orderChecked:false,
  level2:{},
  level3:{},
  creativeChoice:0
};

SCENES.forEach(s=>{ state.lvl1[s.id] = {answered:false, attempts:0, hintsShown:0, selected:null}; });
LEVEL2.forEach((_,i)=>{ state.level2[i] = {revealed:false}; });
LEVEL3.forEach((_,i)=>{ state.level3[i] = {revealed:false}; });

/* ================= RECOMPENSAS ================= */

function addReward(type){
  state.rewards[type]++;
  renderRewardBar(type);
}

function renderRewardBar(justChanged){
  const bar = document.getElementById("rewardbar");
  const chips = [
    ["stars","⭐", state.rewards.stars],
    ["pages","📖", state.rewards.pages],
    ["lupas","🔍", state.rewards.lupas],
    ["pieces","🧩", state.rewards.pieces],
    ["badge","🏅", state.rewards.badge ? 1 : 0]
  ];
  bar.innerHTML = chips.map(([key,icon,val])=>
    `<div class="reward-chip ${key===justChanged?'pop':''}">${icon} ${val}</div>`
  ).join("");
}

/* ================= UTILIDADES ================= */

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function linkVocab(container){
  container.querySelectorAll(".vocab").forEach(span=>{
    span.addEventListener("click", ()=>openVocabModal(span.dataset.word));
  });
}

function openVocabModal(word){
  const v = VOCAB[word];
  if(!v) return;
  if(!state.vocabExplored.has(word)){
    state.vocabExplored.add(word);
    addReward("pieces");
  }
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal">
        <div class="center" style="font-size:40px;">${v.emoji}</div>
        <h3>${v.palabra}</h3>
        <p><strong>Significado:</strong> ${v.significado}</p>
        <p><strong>Ejemplo:</strong> "${v.ejemplo}"</p>
        <p><strong>Palabras parecidas:</strong> ${v.sinonimos.join(", ")}</p>
        <div class="center"><button class="btn-primary" id="closeModal">¡Entendido!</button></div>
      </div>
    </div>
  `);
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) root.innerHTML=""; });
  root.appendChild(overlay);
  document.getElementById("closeModal").onclick = ()=>{ root.innerHTML=""; };
}

/* ================= PANTALLAS ================= */

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderRewardBar();
  if(state.screen==="intro") app.appendChild(renderIntro());
  else if(state.screen==="scene") app.appendChild(renderScene(state.sceneIndex));
  else if(state.screen==="order") app.appendChild(renderOrderChallenge());
  else if(state.screen==="level2") app.appendChild(renderLevel2());
  else if(state.screen==="level3") app.appendChild(renderLevel3());
  else if(state.screen==="final") app.appendChild(renderFinal());
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderIntro(){
  const wrap = el(`
    <div class="card center">
      <div class="tag">Cuento interactivo · ${AGE_RANGE}</div>
      <h1>${STORY_TITLE}</h1>
      <div class="illustration">🎒👦👧💜</div>
      <p>Tobías carga una mochila invisible que solo él puede sentir, y que lo hace llegar siempre el último a los juegos. Cuando Valeria, una niña nueva, se acerca con curiosidad en vez de burla, Tobías descubre que compartir su secreto puede hacerlo sentir menos solo.</p>
      <p>Lee cada escena con atención, piensa en cómo se siente Tobías y descubre lo que todos, a su manera, cargamos por dentro. Al final podrás ganar estrellas, lupas de detective y una insignia especial.</p>
      <button class="btn-primary" id="startBtn">Comenzar la aventura 🎒</button>
    </div>
  `);
  wrap.querySelector("#startBtn").onclick = ()=>{ state.screen="scene"; state.sceneIndex=0; render(); };
  return wrap;
}

function progressDots(total, current){
  let dots = "";
  for(let i=0;i<total;i++){
    dots += `<div class="dot ${i<=current?'on':''}"></div>`;
  }
  return `<div class="progressdots">${dots}</div>`;
}

function renderScene(index){
  const scene = SCENES[index];
  const wrap = el(`
    <div>
      ${progressDots(SCENES.length, index)}
      <div class="card">
        <div class="tag">Escena ${scene.id} de ${SCENES.length}</div>
        <div class="illustration">${scene.illEmoji}<div class="illustration-caption">${scene.illDesc}</div></div>
        <p id="sceneText">${scene.html}</p>
      </div>
      <div class="card" id="activityCard"></div>
    </div>
  `);
  linkVocab(wrap.querySelector("#sceneText"));
  renderLvl1Activity(wrap.querySelector("#activityCard"), scene);
  return wrap;
}

function renderLvl1Activity(container, scene){
  const q = scene.q;
  const st = state.lvl1[scene.id];

  let optsHtml = q.options.map((opt,i)=>
    `<button class="btn-option" data-i="${i}">${opt}</button>`
  ).join("");

  container.innerHTML = `
    <h3>🔎 Nivel 1 · Comprensión literal</h3>
    <p>${q.prompt}</p>
    <div id="optsWrap">${optsHtml}</div>
    <div id="hintArea"></div>
    <div id="feedbackArea"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="hintBtn">💡 Pedir una pista</button>
      <button class="btn-primary" id="continueBtn" disabled>Continuar ➜</button>
    </div>
  `;

  const optsWrap = container.querySelector("#optsWrap");
  const hintArea = container.querySelector("#hintArea");
  const feedbackArea = container.querySelector("#feedbackArea");
  const hintBtn = container.querySelector("#hintBtn");
  const continueBtn = container.querySelector("#continueBtn");

  function paintHints(){
    hintArea.innerHTML = "";
    for(let i=0;i<st.hintsShown;i++){
      hintArea.appendChild(el(`<div class="hint-box">💡 Pista ${i+1}: ${q.hints[i]}</div>`));
    }
    if(st.hintsShown >= q.hints.length){
      hintBtn.disabled = true;
      hintBtn.textContent = "Ya usaste todas las pistas";
    }
  }

  function lockOptions(){
    optsWrap.querySelectorAll("button").forEach(b=> b.disabled = true);
  }

  function showExplanationAndUnlock(){
    feedbackArea.innerHTML = `<div class="feedback good">✅ ${q.explicacion}</div>`;
    lockOptions();
    continueBtn.disabled = false;
    if(!st.answered){
      st.answered = true;
      addReward("stars");
    }
  }

  hintBtn.onclick = ()=>{
    if(st.hintsShown < q.hints.length){
      st.hintsShown++;
      paintHints();
    }
  };

  optsWrap.querySelectorAll("button").forEach(btn=>{
    btn.onclick = ()=>{
      if(st.answered) return;
      const i = Number(btn.dataset.i);
      st.attempts++;
      if(i === q.correct){
        btn.classList.add("correct");
        showExplanationAndUnlock();
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        if(st.attempts >= 2 && st.hintsShown < q.hints.length){
          st.hintsShown = Math.max(st.hintsShown, 2);
          paintHints();
          feedbackArea.innerHTML = `<div class="feedback">Interesante idea, pero mira otra vez... aquí tienes una pista extra para ayudarte 👇</div>`;
        } else {
          feedbackArea.innerHTML = `<div class="feedback">Interesante idea. Vuelve a leer con calma, seguro encuentras la pista correcta.</div>`;
        }
        if(st.attempts >= q.options.length - 1){
          setTimeout(showExplanationAndUnlock, 400);
        }
      }
    };
  });

  continueBtn.onclick = ()=>{
    addReward("pages");
    if(state.sceneIndex < SCENES.length - 1){
      state.sceneIndex++;
      state.screen = "scene";
    } else {
      state.screen = "order";
    }
    render();
  };

  paintHints();
}

function renderOrderChallenge(){
  if(!state.orderArrangement){
    const correctOrder = SCENES.map(s=>s.id);
    let shuffled;
    do{
      shuffled = [...correctOrder].sort(()=>Math.random()-0.5);
    } while(shuffled.join() === correctOrder.join());
    state.orderArrangement = shuffled;
  }

  const wrap = el(`
    <div class="card">
      <h2>🧩 Reto bonus · Ordena las escenas</h2>
      <p>Usa las flechas para poner los sucesos del cuento en el orden correcto, del primero al último.</p>
      <div id="orderList"></div>
      <div id="orderFeedback"></div>
      <div class="nav-row">
        <button class="btn-primary" id="checkOrderBtn">Comprobar orden</button>
        <button class="btn-secondary" id="skipOrderBtn" style="display:none;">Continuar a la Sala de los Detectives ➜</button>
      </div>
    </div>
  `);

  function paintList(){
    const listDiv = wrap.querySelector("#orderList");
    listDiv.innerHTML = "";
    state.orderArrangement.forEach((sceneId, idx)=>{
      const scene = SCENES.find(s=>s.id===sceneId);
      const item = el(`
        <div class="order-item">
          <span class="txt"><strong>${idx+1}.</strong> ${scene.resumen}</span>
          <button data-dir="up" data-idx="${idx}">▲</button>
          <button data-dir="down" data-idx="${idx}">▼</button>
        </div>
      `);
      listDiv.appendChild(item);
    });
    listDiv.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.dataset.idx);
        const dir = btn.dataset.dir;
        const arr = state.orderArrangement;
        if(dir==="up" && idx>0){ [arr[idx-1],arr[idx]] = [arr[idx],arr[idx-1]]; }
        if(dir==="down" && idx<arr.length-1){ [arr[idx+1],arr[idx]] = [arr[idx],arr[idx+1]]; }
        paintList();
      };
    });
  }
  paintList();

  wrap.querySelector("#checkOrderBtn").onclick = ()=>{
    const correctOrder = SCENES.map(s=>s.id).join();
    const fb = wrap.querySelector("#orderFeedback");
    if(state.orderArrangement.join() === correctOrder){
      fb.innerHTML = `<div class="feedback good">✅ ¡Perfecto! Ese es el orden correcto de la historia de Tobías y Valeria.</div>`;
      if(!state.orderChecked){ state.orderChecked = true; addReward("stars"); }
      wrap.querySelector("#skipOrderBtn").style.display = "inline-block";
    } else {
      fb.innerHTML = `<div class="feedback">Casi... vuelve a pensar qué pasó primero: ¿Tobías conoció a Valeria antes o después de contarle su secreto al grupo? Usa las flechas para reordenar.</div>`;
    }
  };

  wrap.querySelector("#skipOrderBtn").onclick = ()=>{
    state.screen = "level2";
    render();
  };

  return wrap;
}

function renderLevel2(){
  const wrap = el(`
    <div class="card">
      <h2>🔍 Sala de los Detectives · Nivel 2</h2>
      <p>Ahora piensa un poco más allá del texto. No hay una sola respuesta correcta: lo importante es explicar bien tu idea. Escribe tu respuesta y luego descubre una reflexión posible.</p>
      <div id="l2list"></div>
      <div class="nav-row">
        <button class="btn-primary" id="toLevel3Btn">Ir a la Sala de la Reflexión ➜</button>
      </div>
    </div>
  `);

  const list = wrap.querySelector("#l2list");
  LEVEL2.forEach((q, idx)=>{
    const st = state.level2[idx];
    const block = el(`
      <div class="hint-box" style="border-left-color:var(--azul); background:#eef7ff;">
        <p><strong>${idx+1}.</strong> ${q.prompt}</p>
        <textarea placeholder="Escribe aquí tu idea..." id="l2text-${idx}"></textarea>
        <div class="nav-row" style="justify-content:space-between;">
          <button class="btn-secondary" data-hint="${idx}">💡 Pista</button>
          <button class="btn-primary" data-reveal="${idx}">Ver una reflexión posible</button>
        </div>
        <div id="l2hint-${idx}"></div>
        <div id="l2guia-${idx}"></div>
      </div>
    `);
    list.appendChild(block);
  });

  wrap.querySelectorAll("button[data-hint]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.hint);
      const box = wrap.querySelector(`#l2hint-${idx}`);
      const hints = LEVEL2[idx].hints;
      const shown = box.children.length;
      if(shown < hints.length){
        box.appendChild(el(`<div class="hint-box">💡 ${hints[shown]}</div>`));
      }
    };
  });

  wrap.querySelectorAll("button[data-reveal]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.reveal);
      const guiaBox = wrap.querySelector(`#l2guia-${idx}`);
      if(!state.level2[idx].revealed){
        state.level2[idx].revealed = true;
        addReward("lupas");
      }
      guiaBox.innerHTML = `<div class="feedback good">🔍 ${LEVEL2[idx].guia}</div>`;
    };
  });

  wrap.querySelector("#toLevel3Btn").onclick = ()=>{
    state.screen = "level3";
    render();
  };

  return wrap;
}

function renderLevel3(){
  const wrap = el(`
    <div class="card">
      <h2>💭 Sala de la Reflexión · Nivel 3</h2>
      <p>Estas preguntas no tienen una única respuesta correcta. Cuéntanos qué piensas de verdad.</p>
      <div id="l3list"></div>
      <div class="nav-row">
        <button class="btn-primary" id="toFinalBtn">Ir al final del cuento ➜</button>
      </div>
    </div>
  `);

  const list = wrap.querySelector("#l3list");
  LEVEL3.forEach((q, idx)=>{
    const block = el(`
      <div class="hint-box" style="border-left-color:var(--rosa); background:#fff0f6;">
        <p><strong>${idx+1}.</strong> ${q.prompt}</p>
        <textarea placeholder="Escribe tu opinión..." id="l3text-${idx}"></textarea>
        <div class="nav-row">
          <button class="btn-primary" data-reveal="${idx}">Compartir mi opinión</button>
        </div>
        <div id="l3guia-${idx}"></div>
      </div>
    `);
    list.appendChild(block);
  });

  wrap.querySelectorAll("button[data-reveal]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.reveal);
      const guiaBox = wrap.querySelector(`#l3guia-${idx}`);
      if(!state.level3[idx].revealed){
        state.level3[idx].revealed = true;
        addReward("lupas");
      }
      guiaBox.innerHTML = `<div class="feedback good">💭 ${LEVEL3[idx].guia}</div>`;
    };
  });

  wrap.querySelector("#toFinalBtn").onclick = ()=>{
    state.screen = "final";
    if(!state.rewards.badge){
      state.rewards.badge = true;
    }
    render();
  };

  return wrap;
}

function renderFinal(){
  const wrap = el(`
    <div class="card center">
      <div class="badge-emoji">🏅</div>
      <h2>¡Insignia de Amigo Comprensivo desbloqueada!</h2>
      <p>Tobías aprendió que no está solo cargando su mochila invisible, y que pedir ayuda o compartir lo que sentimos puede hacer todo más liviano. ¡Y tú aprendiste a mirar a los demás con más comprensión!</p>

      <div class="illustration">🎒💜🤗</div>

      <div style="text-align:left;">
        <h3>📚 Repaso de vocabulario</h3>
        <p>Palabras nuevas que descubriste: ${Object.keys(VOCAB).map(w=>`<span class="vocab" data-word="${w}" id="rvocab-${w}">${w}</span>`).join(", ")}.</p>
      </div>

      <div style="text-align:left;">
        <h3>✏️ Actividad creativa final</h3>
        <p>Elige un reto y escríbelo (o cuéntaselo a un adulto para dibujarlo juntos):</p>
        <ul class="creative-list" id="creativeList"></ul>
        <textarea id="creativeText" placeholder="Escribe aquí tu actividad creativa..."></textarea>
        <div class="nav-row">
          <button class="btn-primary" id="downloadBtn">📥 Descargar mi actividad</button>
        </div>
      </div>

      <div style="margin-top:18px;">
        <h3>🎉 Tus recompensas finales</h3>
        <p>⭐ ${state.rewards.stars} estrellas &nbsp; 🔍 ${state.rewards.lupas} lupas &nbsp; 🧩 ${state.rewards.pieces} piezas &nbsp; 📖 ${state.rewards.pages} páginas &nbsp; 🏅 1 insignia</p>
      </div>

      <div class="nav-row" style="justify-content:center; margin-top:10px;">
        <button class="btn-secondary" id="restartBtn">Volver a jugar desde el inicio</button>
      </div>
      <p class="small">Gracias por leer con atención, ¡nos vemos en la próxima aventura de Tobías!</p>
    </div>
  `);

  Object.keys(VOCAB).forEach(w=>{
    wrap.querySelector(`#rvocab-${w}`).addEventListener("click", ()=>openVocabModal(w));
  });

  const creativeListEl = wrap.querySelector("#creativeList");
  CREATIVE_OPTIONS.forEach((opt,i)=>{
    creativeListEl.appendChild(el(`<li><label><input type="radio" name="creative" ${i===0?"checked":""} value="${i}"> ${opt}</label></li>`));
  });
  creativeListEl.querySelectorAll("input[name='creative']").forEach(r=>{
    r.onchange = ()=>{ state.creativeChoice = Number(r.value); };
  });

  wrap.querySelector("#downloadBtn").onclick = ()=>{
    const text = wrap.querySelector("#creativeText").value.trim();
    const chosen = CREATIVE_OPTIONS[state.creativeChoice];
    const content = `Mi actividad creativa - ${STORY_TITLE}\n\nReto elegido: ${chosen}\n\nMi respuesta:\n${text || "(sin escribir todavía)"}\n`;
    const blob = new Blob([content], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mi-actividad-creativa.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  wrap.querySelector("#restartBtn").onclick = ()=>{
    location.reload();
  };

  return wrap;
}

/* ================= INICIO ================= */
render();
</script>
</body>
